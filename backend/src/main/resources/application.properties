spring.application.name=backend
server.port=8080

# ============================
# DATABASE CONFIGURATION
# ============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/retailforge2}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:retailforge2_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:retailforge2_dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.session.jdbc.initialize-schema=never

# Default is 30 minutes; extended for local dev so a login (and its chat
# session) survives longer stretches of testing without silently expiring.
server.servlet.session.timeout=4h

# ============================
# ACTUATOR
# ============================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Spring Boot auto-configures a Kafka health check the moment spring-kafka is
# on the classpath - this happens independently of our own kafka.enabled flag
# (see KAFKA CONFIGURATION below), so without this line, /actuator/health (and
# therefore the backend's Docker healthcheck) would report the whole app DOWN
# whenever no broker is reachable, even with Kafka publishing turned off.
# Tying it to kafka.enabled keeps health-check behavior unchanged while Kafka
# is off, and only starts reflecting real broker connectivity once it's on.
management.health.kafka.enabled=${kafka.enabled:false}

# ============================
# FILE UPLOAD
# ============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ============================
# MEDIA STORAGE
# ============================
app.media.root=${APP_MEDIA_ROOT:${user.dir}/media}

# ============================
# STRIPE CONFIGURATION
# ============================
stripe.secret-key=${STRIPE_SECRET_KEY:sk_test_}
stripe.publishable-key=${STRIPE_PUBLISHABLE_KEY:pk_test_}
stripe.currency=usd

# ============================
# KAFKA CONFIGURATION
# ============================
# Publishing/consuming is entirely opt-in via kafka.enabled - defaults to
# false so the app starts and runs normally (native or via `docker compose
# up`) without a broker present. Set KAFKA_ENABLED=true once the kafka
# service is running (see docker-compose.yml) to activate event publishing.
kafka.enabled=${KAFKA_ENABLED:false}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.client-id=${KAFKA_CLIENT_ID:retailforge2-backend}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID:retailforge2-backend}
kafka.topic.orders=${KAFKA_TOPIC_ORDERS:rf2.orders}
kafka.topic.auth=${KAFKA_TOPIC_AUTH:rf2.auth}
kafka.topic.inventory=${KAFKA_TOPIC_INVENTORY:rf2.inventory}

# JSON producer/consumer settings. NOTE: these five properties are no longer
# actually read by anything - KafkaClientConfig.java defines the producer and
# consumer factories explicitly (with the same StringSerializer/
# JacksonJsonSerializer choices and the same trusted-packages scoping)
# instead of relying on Spring Boot to build them from these properties
# automatically, after that autoconfiguration turned out not to produce a
# usable KafkaTemplate bean on this Spring Boot version. Left here as
# documentation of the intent; if KafkaClientConfig ever changes, update it
# there, not here.
#
# JacksonJsonSerializer/JacksonJsonDeserializer (Jackson 3), not the older
# JsonSerializer/JsonDeserializer - those were deprecated for removal in
# Spring for Apache Kafka 4.0, in favor of these Jackson-3-based versions.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.retailforge2.backend.events

# Threshold (inclusive) at or below which a stock change is considered
# "low stock" for the purposes of the inventory event - mirrors the
# original project's LOW_STOCK_THRESHOLD.
kafka.low-stock-threshold=${LOW_STOCK_THRESHOLD:5}

# ============================
# AI CONFIGURATION
# ============================
# application-secrets.properties is gitignored and lives only on this machine
# (see backend/application-secrets.properties.example for the template). It's
# imported here so real keys never need to touch a tracked file or a Windows
# system environment variable - Spring Boot just reads it fresh on every
# startup, the same way it reads this file, so there's no IDE run-config
# caching to fight with.
spring.config.import=optional:file:./application-secrets.properties
spring.ai.openai.api-key=${SPRING_AI_OPENAI_API_KEY:sk-}
spring.ai.anthropic.api-key=${SPRING_AI_ANTHROPIC_API_KEY:sk-}

# Both the Anthropic and OpenAI starters are on the classpath; this picks which
# one's ChatModel auto-configuration actually activates so there's no bean
# ambiguity - only the selected provider is ever called (and billed).
# Currently set to "openai". The Claude/Anthropic settings below are left
# in place but inactive while this says "openai" - switch this one line
# back to "anthropic" any time to reactivate Claude, no other changes needed.
spring.ai.model.chat=openai
spring.ai.openai.chat.options.model=gpt-4o-mini

# Inactive while spring.ai.model.chat=openai above; kept so switching back to
# Claude later is a one-line change. Double-check this model id is still
# current at docs.claude.com/en/docs/about-claude/models before switching back.
spring.ai.anthropic.chat.options.model=claude-sonnet-4-5

# Chat memory (multi-turn conversation history), persisted in this same
# Postgres database. Schema is managed by the V13 Flyway migration, same as
# every other table - "never" stops Spring AI from also trying to create
# the table itself at startup (it was briefly set to "always" so the real
# schema Spring AI creates could be captured and turned into V13).
spring.ai.chat.memory.repository.jdbc.initialize-schema=never