spring.application.name=backend
server.port=8080

# ============================
# DATABASE CONFIGURATION
# ============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/rf2_p2}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:rf2_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:rf2_dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.session.jdbc.initialize-schema=never

# ============================
# ACTUATOR
# ============================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ============================
# FILE UPLOAD
# ============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ============================
# MEDIA STORAGE
# ============================
app.media.root=${APP_MEDIA_ROOT:${user.dir}/media}

