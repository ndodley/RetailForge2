name: retailforge2

services:
  postgres:
    image: postgres:18.3
    container_name: retailforge2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-retailforge2}
      POSTGRES_USER: ${POSTGRES_USER:-retailforge2_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retailforge2_dev_password}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-retailforge2_user} -d ${POSTGRES_DB:-retailforge2}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
    container_name: retailforge2-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-retailforge2}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-retailforge2_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-retailforge2_dev_password}
      APP_MEDIA_ROOT: /app/media
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-pk_test_}
      SPRING_AI_OPENAI_API_KEY: ${SPRING_AI_OPENAI_API_KEY:-sk-}
      SPRING_AI_ANTHROPIC_API_KEY: ${SPRING_AI_ANTHROPIC_API_KEY:-sk-}
      # Without these, KAFKA_ENABLED and friends only exist in .env on the host -
      # docker-compose.yml has to explicitly pass each one through to actually
      # land inside the container's environment, the same as every variable above.
      KAFKA_ENABLED: ${KAFKA_ENABLED:-false}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_CLIENT_ID: ${KAFKA_CLIENT_ID:-retailforge2-backend}
      KAFKA_CONSUMER_GROUP_ID: ${KAFKA_CONSUMER_GROUP_ID:-retailforge2-backend}
      KAFKA_TOPIC_ORDERS: ${KAFKA_TOPIC_ORDERS:-rf2.orders}
      KAFKA_TOPIC_AUTH: ${KAFKA_TOPIC_AUTH:-rf2.auth}
      KAFKA_TOPIC_INVENTORY: ${KAFKA_TOPIC_INVENTORY:-rf2.inventory}
      LOW_STOCK_THRESHOLD: ${LOW_STOCK_THRESHOLD:-5}
    ports:
      - "8080:8080"
    volumes:
      - backend_media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s

  kafka:
    image: apache/kafka:3.8.0
    container_name: retailforge2-kafka
    restart: unless-stopped
    # Opt-in: this service only starts when you explicitly ask for it with
    # `docker compose --profile kafka up --build -d`. A plain `docker compose
    # up --build -d` (no --profile flag) never starts this container, matching
    # KAFKA_ENABLED defaulting to false - the rest of the stack is completely
    # unaffected by Kafka's presence or absence.
    profiles: ["kafka"]
    # Single-node broker using KRaft mode (Kafka's built-in consensus/metadata
    # system) - no separate Zookeeper container needed, unlike older Kafka setups.
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      # Two advertised listeners: PLAINTEXT is what other containers (backend)
      # use via the Docker network hostname "kafka"; PLAINTEXT_HOST is what
      # tools running directly on your machine (e.g. Artillery, if you ever
      # run it outside Docker) use via localhost.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "29092:29092"
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
        VITE_STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-pk_test_}
    container_name: retailforge2-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  backend_media:
  kafka_data:
